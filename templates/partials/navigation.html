<nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
            <!-- Logo -->
            <div class="flex-shrink-0">
                <a hx-get="{% url 'home' %}" 
                   hx-target="#main-content"
                   hx-push-url="{% url 'home' %}"
                   class="text-xl font-bold text-gray-800 cursor-pointer">
                    Mini LMS
                </a>
            </div>

            <!-- Navigation Links -->
            <div class="hidden md:block">
                <div class="ml-10 flex items-baseline space-x-4">
                    <a hx-get="{% url 'home' %}"
                       hx-target="#main-content"
                       hx-push-url="{% url 'home' %}"
                       class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium cursor-pointer">
                        Home
                    </a>
                    
                    <a hx-get="{% url 'course_list' %}"
                       hx-target="#main-content"
                       hx-push-url="{% url 'course_list' %}"
                       class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium cursor-pointer">
                        Courses
                    </a>

                    {% if user.is_authenticated %}
                        <!-- User dropdown -->
                        <div class="relative" x-data="{ open: false }">
                            <button @click="open = !open" class="flex items-center text-sm font-medium text-gray-600 hover:text-gray-900 focus:outline-none">
                                {{ user.username }}
                                <svg class="ml-1 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            
                            <div x-show="open" 
                                 @click.away="open = false"
                                 class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50">
                                <a hx-get="{% url 'dashboard' %}"
                                   hx-target="#main-content"
                                   hx-push-url="{% url 'dashboard' %}"
                                   class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 cursor-pointer">
                                    Dashboard
                                </a>
                                <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    Sign out
                                </a>
                            </div>
                        </div>
                    {% else %}
                        <a hx-get="{% url 'login' %}"
                           hx-target="#main-content"
                           hx-push-url="{% url 'login' %}"
                           class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium cursor-pointer">
                            Login
                        </a>
                        <a hx-get="{% url 'register' %}"
                           hx-target="#main-content"
                           hx-push-url="{% url 'register' %}"
                           class="bg-blue-600 text-white hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium cursor-pointer">
                            Register
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</nav>
