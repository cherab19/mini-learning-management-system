<div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
    {% for course in courses %}
    <div class="bg-white overflow-hidden shadow rounded-lg hover:shadow-lg transition-shadow duration-300">
        <div class="p-6">
            <h3 class="text-lg font-medium text-gray-900">{{ course.title }}</h3>
            <p class="mt-2 text-sm text-gray-500 line-clamp-3">{{ course.description }}</p>
            <div class="mt-4 flex items-center justify-between">
                <span class="text-sm text-gray-500">By {{ course.instructor.username }}</span>
                <button hx-get="{% url 'course_detail' course.id %}"
                        hx-target="#main-content"
                        hx-push-url="{% url 'course_detail' course.id %}"
                        class="inline-flex items-center px-3 py-1 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 cursor-pointer">
                    View Course
                </button>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-span-3 text-center py-8">
        <p class="text-gray-500">No courses available yet.</p>
    </div>
    {% endfor %}
</div>
