{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini LMS - {% block title %}Home{% endblock %}</title>
    
    <!-- Tailwind CSS CDN (or use local) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Alpine.js for reactive components -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-gray-50" 
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      x-data="{ 
          sidebarOpen: false,
          notifications: [],
          addNotification(message, type='info') {
              this.notifications.push({id: Date.now(), message, type});
              setTimeout(() => {
                  this.notifications.shift();
              }, 5000);
          }
      }">
    
    <!-- Notification System -->
    <div class="fixed top-4 right-4 z-50 space-y-2" x-show="notifications.length > 0">
        <template x-for="notification in notifications" :key="notification.id">
            <div x-show="true"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform translate-x-full"
                 x-transition:enter-end="opacity-100 transform translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 transform translate-x-0"
                 x-transition:leave-end="opacity-0 transform translate-x-full"
                 class="p-4 rounded-lg shadow-lg"
                 :class="{
                     'bg-green-500 text-white': notification.type === 'success',
                     'bg-blue-500 text-white': notification.type === 'info',
                     'bg-red-500 text-white': notification.type === 'error',
                     'bg-yellow-500 text-white': notification.type === 'warning'
                 }">
                <span x-text="notification.message"></span>
            </div>
        </template>
    </div>

    <!-- Navigation -->
    {% include 'partials/navigation.html' %}

    <!-- Main Content -->
    <main id="main-content" class="min-h-screen">
        {% block content %}
        <!-- SPA content will be loaded here -->
        {% endblock %}
    </main>

    <!-- Global JavaScript -->
    <script src="{% static 'js/spa.js' %}"></script>
    
    <!-- HTMX Config -->
    <script>
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            // Show loading state
            const target = evt.target;
            target.classList.add('loading');
        });
        
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            // Remove loading state
            const target = evt.target;
            target.classList.remove('loading');
            
            // Update browser URL without reload
            if (evt.detail.xhr.status === 200) {
                const newUrl = evt.detail.xhr.getResponseHeader('HX-Push-Url');
                if (newUrl) {
                    history.pushState({}, '', newUrl);
                }
            }
        });
        
        // Handle browser back/forward
        window.addEventListener('popstate', function(event) {
            htmx.ajax('GET', window.location.pathname, '#main-content');
        });
    </script>
</body>
</html>
